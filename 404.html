<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/locacamba/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Locaçamba">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Locaçamba</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js?v=1794440411" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=1794440411" async></script>
  <script>
    // Marca desta publicação; o publicar.py troca na hora de enviar.
    window.APP_BUILD = '1794440411';

    // O app guardado no celular pode ficar preso numa versão antiga, porque
    // o próprio arquivo que busca atualização vem do cache. Então perguntamos
    // ao servidor qual é a versão publicada: sendo outra, limpamos tudo.
    function conferirVersao() {
      fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (info) {
          if (!info || !info.build) return;
          // as marcas são relógios: só vale recarregar para uma mais nova.
          // Logo depois de publicar, o servidor ainda pode responder a marca
          // anterior, e trocar para ela seria andar para trás.
          var aqui = Number(window.APP_BUILD);
          var la = Number(info.build);
          if (!la || (aqui && la <= aqui)) return;
          // uma recarga por versão: se não resolver, não fica em laço
          if (sessionStorage.getItem('app_build_recarregado') === String(la)) return;
          sessionStorage.setItem('app_build_recarregado', String(la));
          limparELRecarregar();
        })
        .catch(function () { /* sem rede: segue com o que está */ });
    }

    function limparELRecarregar() {
      var tarefas = [];
      if (window.caches && caches.keys) {
        tarefas.push(caches.keys().then(function (nomes) {
          return Promise.all(nomes.map(function (n) { return caches.delete(n); }));
        }));
      }
      if ('serviceWorker' in navigator) {
        tarefas.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      Promise.all(tarefas).catch(function () {}).then(function () {
        window.location.reload();
      });
    }

    conferirVersao();
    // confere de novo a cada 5 minutos e ao voltar para o app
    setInterval(conferirVersao, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) conferirVersao();
    });

    // O service worker do Flutter guarda a versão nova e só aplica na recarga
    // seguinte. Aqui recarregamos sozinhos assim que a nova versão fica pronta.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var novo = reg.installing;
          if (!novo) return;
          novo.addEventListener('statechange', function () {
            if (novo.state === 'installed' && navigator.serviceWorker.controller) {
              window.location.reload();
            }
          });
        });
        reg.update();
        setInterval(function () { reg.update(); }, 5 * 60 * 1000);
      });
    }
  </script>
</body>
</html>
